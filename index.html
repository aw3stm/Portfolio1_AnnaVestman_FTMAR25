<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Anna Vestman | Front end developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
   href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
   rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
 </head>
 <body>
  <nav id="navContainer">
   <div class="navWrapper">
    <a href="index.html">
     <img src="images/logoPortfolio63x63.svg" alt="Anna Vestman logo" />
    </a>

    <button
     id="hamburgerBtn"
     aria-label="Navigation toggle"
     aria-expanded="false"
     aria-controls="mobileNav">
     <img src="icons/bars-solid-full.svg" class="openIcon" alt="Menu open" />
     <img src="icons/xmark-solid-full.svg" class="closeIcon" alt="Close menu" />
    </button>

    <div class="navContentLinks" id="desktopNav">
     <a href="#projects" data-link>Projects</a>
     <a href="#about" data-link>About me</a>
     <a href="#contact" data-link>Contact</a>
    </div>
   </div>
  </nav>
  <div id="mobileNav" class="navOverlay">
   <a href="#projects" data-link>Projects</a>
   <a href="#about" data-link>About me</a>
   <a href="#contact" data-link>Contact</a>
  </div>

  <main>
   <section class="heroSection">
    <div id="heroContainer">
     <img
      src="images/heroImg3.svg"
      alt="sketch of Anna with text in the background" />
    </div>
   </section>

   <section class="cardSection">
    <div class="cardTop">
     <h1 class="cardTitle">Some of my projects</h1>
    </div>

    <div class="cardContainer">
     <article class="card">
      <div class="cardImg">
       <img
        src="images/thumbFirstRainy.png"
        alt="landing page of Rainydays project one. Only html and CSS" />
      </div>
      <div class="cardContent">
       <h2>Rainy Days</h2>
       <p>HTML and CSS Course</p>
       <div class="cardBtn">
        <a
         href="https://aw3stm.github.io/html-css-ca-anna-vestman/"
         class="primaryBtn mainPage"
         target="_blank"
         rel="noopener noreferrer"
         >Rainy Days</a
        >
        <a
         href="https://github.com/aw3stm/html-css-ca-anna-vestman"
         class="primaryBtn repoPage"
         target="_blank"
         rel="noopener noreferrer"
         >Visit Repo</a
        >
       </div>
      </div>
     </article>

     <article class="card">
      <div class="cardImg">
       <img
        src="images/js_rainydays.png"
        alt="landing page of Rainydays version 2 with JavaScript." />
      </div>
      <div class="cardContent">
       <h2>Rainy Days with JS</h2>
       <p>JavaScript 1 course</p>
       <div class="cardBtn">
        <a
         href="https://aw3stm.github.io/rainyDays_js/"
         class="primaryBtn mainPage"
         target="_blank"
         rel="noopener noreferrer"
         >Rainy Days JS</a
        >
        <a
         href="https://github.com/aw3stm/rainyDays_js"
         class="primaryBtn repoPage"
         target="_blank"
         rel="noopener noreferrer"
         >Visit Repo</a
        >
       </div>
      </div>
     </article>

     <article class="card">
      <div class="cardImg">
       <img
        src="images/thumbnailSemesterProject.png"
        alt="landing page of semester project. Group project" />
      </div>
      <div class="cardContent">
       <h2>Community Science Museum</h2>
       <p>Semester project / Group project</p>
       <div class="cardBtn">
        <a
         href="https://aw3stm.github.io/SP1-Community-Science-Museum/"
         class="primaryBtn mainPage"
         target="_blank"
         rel="noopener noreferrer"
         >Semester Project</a
        >
        <a
         href="https://github.com/aw3stm/SP1-Community-Science-Museum"
         class="primaryBtn repoPage"
         target="_blank"
         rel="noopener noreferrer"
         >GitHub Repo</a
        >
       </div>
      </div>
     </article>
    </div>
   </section>

   <section class="aboutSection"></section>
  </main>
 </body>
</html>
